vfxgen: 1
name: heal_aura
description: "Healing aura: glowing ground rings under a rising column of light, motes and plus sparkles."
size: [256, 384]
fps: 16
duration: 2.0
loop: true
anchors: {ground: [128, 318]}
vars:
  colors: {default: heal, doc: main colour ramp}
  intensity: {default: 1.0, min: 0, max: 4, doc: overall brightness (exposure)}
  ring_radius: {default: 1.0, min: 0.2, max: 1.15, doc: "ground ring size multiplier (<= 1.15)"}
  column: {default: 1.0, min: 0, max: 4, doc: "brightness of the rising light column (0 = off)"}
  column_height: {default: 1.0, min: 0.1, max: 1.09, doc: height of the column multiplier}
  motes: {default: 34, min: 0, max: 400, doc: number of rising motes}
  pluses: {default: 9, min: 0, max: 100, doc: number of plus-sign sparkles}
  rise_speed: {default: 1, min: 1, max: 4, doc: whole-number rise speed of motes and column streaks (cycles per loop)}
  rotation_speed: {default: 1, min: -4, max: 4, doc: whole-number rotation of the dashed ground rings (steps per loop)}
  pulse: {default: 0.1, min: 0, max: 0.9, doc: brightness pulse amplitude}
  inner_rings: {default: true, doc: draw the dashed inner ground rings}
  glow: {default: 1.0, min: 0, max: 3, doc: bloom strength}
channels:
  light: {kind: light, palette: "${colors}", exposure: "${intensity}",
          bloom: [[1.5, "${0.5 * glow}"], [5, "${0.45 * glow}"], [14, "${0.4 * glow}"]], alpha_gamma: 0.9}
layers:
  - id: column
    effect: light_column
    at: [128, 318]
    anchor: {px: [0, 0]}
    enabled: "${column > 0}"
    params: {period: 2.0, style: aura, width: "${84.28 * ring_radius}", height: "${min(298, 272 * column_height)}",
             brightness: "${0.65 * column}", top_fade: -1, fade_power: 1.6, ground_squash: 0.3,
             rise: "${rise_speed}", streak_x: 14, streak_y: 60, pulse: "${pulse}", pulse_cycles: 1}
  # ground rings (share the column's pulse)
  - {id: ring, effect: ring, at: [128, 318],
     params: {period: 2.0, radius: "${98 * ring_radius}", width: 2.0, brightness: 1.15, squash: 0.3,
              pulse: "${pulse}"}}
  - {id: ring_soft, effect: ring, at: [128, 318],
     params: {period: 2.0, radius: "${98 * ring_radius}", width: 7.0, brightness: 0.4, squash: 0.3,
              pulse: "${pulse}"}}
  - {id: disc, effect: glow, at: [128, 318],
     params: {period: 2.0, radius: "${46 * ring_radius}", brightness: 0.18, halo_radius: 0, squash: 0.3,
              pulse: "${pulse}"}}
  - {id: dashes, effect: ring, at: [128, 318], enabled: "${inner_rings}",
     params: {period: 2.0, radius: "${82.3 * ring_radius}", width: 1.8, brightness: 0.9, squash: 0.3,
              dashes: 16, duty: 0.6, rotation: "${-rotation_speed}", pulse: "${pulse}"}}
  - {id: dashes2, effect: ring, at: [128, 318], enabled: "${inner_rings}",
     params: {period: 2.0, radius: "${64.7 * ring_radius}", width: 1.5, brightness: 0.6, squash: 0.3,
              dashes: 24, duty: 0.58, rotation: "${rotation_speed}", pulse: "${pulse}"}}
  # rising motes and plus sparkles (heights follow the column height)
  - id: motes
    effect: particles
    at: [128, 318]
    anchor: {px: [0, 0]}
    params: {period: 2.0, count: "${motes}", shape: box, radius: "${70 * ring_radius}", radius_y: "${20 * ring_radius}",
             angle: -90, spread: 0, speed_min: "${95 * column_height}", speed_max: "${165 * column_height}",
             laps_min: "${rise_speed}", laps_max: "${2 * rise_speed}", sway: 4.5, sway_freq: 2,
             style: dot, size: 1.3, brightness: 1.9, brightness_var: 0.37, fade_in: 0.15, fade_out: 1.3,
             extent: 300}
  - id: pluses
    effect: particles
    at: [128, 318]
    anchor: {px: [0, 0]}
    params: {period: 2.0, count: "${pluses}", shape: box, radius: "${76 * ring_radius}", radius_y: "${22 * ring_radius}",
             angle: -90, spread: 0, speed_min: "${60 * column_height}", speed_max: "${110 * column_height}",
             laps_min: "${rise_speed}", laps_max: "${rise_speed}", style: plus, size: 2.0, brightness: 2.6,
             brightness_var: 0.24, fade_in: 0.45, fade_out: 0.8, halo: 0.12, extent: 300}
