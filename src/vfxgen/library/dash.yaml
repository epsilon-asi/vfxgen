vfxgen: 1
name: dash
description: "Dash: three soft afterimage ribbons streak behind a character rushing to the right, with speed lines and a dust kick at the take-off (and a little skid at the stop). Pivot on the take-off feet; the dash covers `distance` px to +x."
size: [352, 160]
fps: 24
duration: 0.6
loop: false
blend: alpha
pivot: {px: [64, 124]}
anchors: {start: [64, 124], end: [264, 124]}
events:
  - {name: dash_start, t: 0.0}
  - {name: dash_end, t: 0.22, data: {distance: 200}}
vars:
  colors: {default: wind, doc: "main colour ramp (afterimage ribbons, speed lines)"}
  dust_palette: {default: dust, doc: dust colours (shadow -> lit)}
  trail_length: {default: 1.0, min: 0.3, max: 2, doc: afterimage length (time window multiplier)}
  trail_width: {default: 1.0, min: 0.3, max: 2, doc: afterimage ribbon width multiplier}
  brightness: {default: 1.0, min: 0, max: 3, doc: afterimage brightness}
  speed_lines: {default: 14, min: 0, max: 60, doc: speed lines}
  dust: {default: 1.0, min: 0, max: 3, doc: "dust kick density (0 = off)"}
channels:
  smoke: {kind: smoke, palette: "${dust_palette}", density: 5.0, shadow: 0.8, ambient: 0.3, relief: 1.4,
          height_gain: 0.3, size_ref: 352}
  light: {kind: light, palette: "${colors}", bloom: [[1.5, 0.35], [5, 0.25], [14, 0.15]], exposure: 1.0,
          alpha_gamma: 1.1}
defs:
  rib: &rib {period: 1.0, mode: follow, length_time: "${0.14 * trail_length}", samples: 20, smooth: 3,
             min_speed: 250, reach: 176, taper: 0.7, fade: 1.6, head_fade: 0.1, softness: 0.85,
             core_width: 0.2, breakup: 0.55, breakup_scale: 5, flow: 0}
layers:
  - id: body
    effect: glow
    opacity: 0
    length: 0.42
    move: {path: {line: [[64, 92], [264, 92]]}, duration: 0.22, ease: out}
    params: {period: 1.0, radius: 1}
  - id: rib_head
    effect: ribbon
    at: [176, 80]
    anchor: {px: [0, 0]}
    follow: {layer: body, anchor: {px: [0, -28]}}
    params:
      <<: *rib
      width_start: "${16 * trail_width}"
      width_end: 2
      brightness: "${0.5 * brightness}"
      core: 0.6
  - id: rib_body
    effect: ribbon
    at: [176, 80]
    anchor: {px: [0, 0]}
    follow: {layer: body, anchor: {px: [0, 2]}}
    params:
      <<: *rib
      width_start: "${24 * trail_width}"
      width_end: 3
      brightness: "${0.6 * brightness}"
      core: 0.8
  - id: rib_feet
    effect: ribbon
    at: [176, 80]
    anchor: {px: [0, 0]}
    follow: {layer: body, anchor: {px: [0, 26]}}
    params:
      <<: *rib
      width_start: "${14 * trail_width}"
      width_end: 2
      brightness: "${0.45 * brightness}"
      core: 0.5
  - id: lines
    effect: burst
    at: [176, 92]
    anchor: {px: [0, 0]}
    params: {duration: 0.42, count: "${int(speed_lines)}", shape: box, radius: 80, radius_y: 34, angle: 180,
             spread: 0, speed_min: 200, speed_max: 420, drag: 3, life_min: 0.12, life_max: 0.24, stagger: 0.14,
             style: streak, tail: 0.09, size: 0.7, brightness: "${1.2 * brightness}", fade_in: 0.1, fade_out: 1.2,
             extent: 170}
  - id: kick
    effect: smoke_burst
    enabled: "${dust > 0}"
    at: [64, 124]
    anchor: origin
    params: {duration: 0.55, mode: burst, count: 16, spread: 420, spread_start: 2, drag: 7, lateral_min: 0.6,
             forward: 0.08, lift: 40, rise: 10, ground: true, extent: 80, radius_start: 4, radius_end: 12,
             radius_var: 0.3, life_min: 0.4, life_max: 0.52, stagger: 0.04, fade_in: 0.05, fade_out: 0.3,
             density: "${0.13 * dust}", billow: 0.9, wisp_start: 0.2, wispiness: 0.7, grain: 5}
  - id: skid
    effect: smoke_burst
    enabled: "${dust > 0}"
    at: [258, 124]
    anchor: origin
    start: 0.16
    params: {duration: 0.42, mode: burst, count: 7, spread: 140, spread_start: 0, drag: 6, lateral_min: 0.6,
             forward: 0.85, lift: 30, rise: 8, ground: true, extent: 50, radius_start: 4, radius_end: 11,
             radius_var: 0.25, life_min: 0.3, life_max: 0.4, stagger: 0.04, fade_in: 0.05, fade_out: 0.35,
             density: "${0.11 * dust}", billow: 0.9, wisp_start: 0.15, wispiness: 0.5, grain: 5}
