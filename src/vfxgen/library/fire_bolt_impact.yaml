vfxgen: 1
name: fire_bolt_impact
description: "Fire bolt impact: the head bursts into a small fireball with a hot flash and shockwave, sparks splash back from the hit and the fire cools into a curl of smoke. Pivot on the impact point."
size: [224, 224]
fps: 24
duration: 0.9
loop: false
blend: alpha
pivot: {px: [128, 120]}
anchors: {impact: [128, 120]}
events:
  - {name: impact, t: 0.0, data: {radius: 48}}
vars:
  colors: {default: fire, doc: main colour ramp (shared by the fire_bolt family)}
  smoke_palette: {default: explosion_smoke, doc: smoke colours (shadow -> lit)}
  head_size: {default: 1.0, min: 0.5, max: 1.5, doc: head size multiplier (match launch and travel)}
  radius: {default: 1.0, min: 0.4, max: 1.6, doc: blast size multiplier}
  intensity: {default: 1.0, min: 0, max: 3, doc: brightness multiplier}
  sparks: {default: 26, min: 0, max: 120, doc: sparks splashing back from the hit}
  smoke: {default: 1.0, min: 0, max: 3, doc: "smoke amount (0 = pure fire)"}
channels:
  smoke: {kind: smoke, palette: "${smoke_palette}", density: 1.2, shadow: 1.0, size_ref: 224,
          lit_by: {channels: [light], amount: 0.8}}
  light: {kind: light, palette: "${colors}", exposure: 1.0, alpha_gamma: 0.72,
          bloom: [[2, 0.25], [8, 0.2], [24, 0.15]]}
layers:
  - id: head
    effect: projectile_core
    at: [124, 120]
    anchor: head
    length: 0.06
    fade: {out: 0.04}
    scale: {keys: [[0, 1.0], [0.06, 1.5]]}
    params: {period: 1.0, style: orb, radius: "${8 * head_size}", stretch: 1.8, brightness: "${0.8 * intensity}",
             core: "${1.6 * intensity}", rim: 0.3, turbulence: 0.6, halo: "${0.22 * intensity}", halo_radius: 2.6}
  - id: flash
    effect: flash
    at: [128, 120]
    anchor: {px: [0, 0]}
    params: {duration: 0.35, radius: "${7 * radius}", grow: "${110 * radius}", brightness: "${3.0 * intensity}",
             decay: 0.05, afterglow_radius: "${22 * radius}", afterglow_brightness: "${0.6 * intensity}",
             afterglow_decay: 0.1}
  - id: cloud
    effect: fire_cloud
    at: [128, 120]
    anchor: blast
    time_warp: {curve: power, exp: 1.3}
    params: {duration: 0.9, radius: "${30 * radius}", creep: "${14 * radius}", expand_time: 0.06, count: 14,
             rise: "${30 * radius}", puff_rise: "${20 * radius}", intensity: "${intensity}", burn_time: 0.55,
             smoke: "${0.8 * smoke}", smoke_fade: 0.35, erode_start: 0.25, smoke_gone: 0.88}
  - id: ring
    effect: shockwave
    at: [128, 120]
    anchor: {px: [0, 0]}
    params: {duration: 0.3, radius_start: 6, radius_end: "${62 * radius}", expand_time: 0.07, width_start: 3,
             width_end: 1.5, brightness: "${0.8 * intensity}", fade_time: 0.08, breakup: 0.5}
  - id: sparks
    effect: burst
    at: [126, 120]
    anchor: {px: [0, 0]}
    params: {duration: 0.6, count: "${int(sparks)}", angle: 180, spread: 230, speed_min: 160, speed_max: 360,
             drag: 3, gravity: 320, life_min: 0.25, life_max: 0.55, style: streak, tail: 0.04, size: 0.85,
             brightness: 1.9, fade_in: 0, fade_out: 1.3, extent: 105}
