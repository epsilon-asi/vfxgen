vfxgen: 1
name: arcane_missile_impact
description: "Arcane missile impact: the plasma head pops into a spiky violet star with a hot flash, a noise-broken shockwave, a dashed rune ring and sparkles scattering outward. Pivot on the impact point."
size: [224, 224]
fps: 24
duration: 0.6
loop: false
blend: additive
pivot: {px: [120, 112]}
anchors: {impact: [120, 112]}
events:
  - {name: impact, t: 0.0, data: {radius: 50}}
vars:
  colors: {default: arcane, doc: main colour ramp (shared by the arcane_missile family)}
  head_size: {default: 1.0, min: 0.5, max: 1.5, doc: head size multiplier (match launch and travel)}
  radius: {default: 1.0, min: 0.4, max: 1.5, doc: burst size multiplier}
  sparkles: {default: 22, min: 0, max: 100, doc: sparkles scattering outward}
  motes: {default: 24, min: 0, max: 120, doc: motes thrown out}
  intensity: {default: 1.0, min: 0, max: 3, doc: brightness multiplier}
channels:
  light: {kind: light, palette: "${colors}", bloom: [[1.5, 0.5], [5, 0.45], [16, 0.35]],
          exposure: "${intensity}", alpha_gamma: 0.8}
layers:
  - id: head
    effect: projectile_core
    at: [120, 112]
    anchor: head
    length: 0.06
    fade: {out: 0.04}
    scale: {keys: [[0, 1.0], [0.06, 1.6]]}
    params: {period: 1.0, style: orb, radius: "${9 * head_size}", stretch: 2.4, brightness: 1.0, core: 1.8,
             rim: 0.7, turbulence: 0.7, halo: 0.3, halo_radius: 2.4, spin: 3}
  - id: flash
    effect: flash
    at: [120, 112]
    anchor: {px: [0, 0]}
    params: {duration: 0.3, radius: 6, grow: 90, brightness: 2.6, decay: 0.05, afterglow_radius: "${20 * radius}",
             afterglow_brightness: 0.5, afterglow_decay: 0.1}
  - id: star
    effect: star_burst
    at: [120, 112]
    start: 0.02
    params: {duration: 0.26, points: 7, radius: "${34 * radius}", spikiness: 1.2, brightness: 0.9}
  - id: ring
    effect: shockwave
    at: [120, 112]
    anchor: {px: [0, 0]}
    params: {duration: 0.4, radius_start: 6, radius_end: "${70 * radius}", expand_time: 0.09, width_start: 2.5,
             width_end: 1.2, brightness: 0.9, fade_time: 0.1, breakup: 0.6}
  - id: rune
    effect: ring
    at: [120, 112]
    length: 0.45
    fade: {out: 0.25}
    scale: {keys: [[0, 0.4], [0.3, 1.0, out]]}
    params: {period: 0.5, radius: "${46 * radius}", width: 1.0, brightness: 1.1, dashes: 12, duty: 0.55, rotation: 2}
  - id: sparkles
    effect: ring_glints
    at: [120, 112]
    anchor: {px: [0, 0]}
    params: {duration: 0.58, count: "${int(sparkles)}", radius_start: 6, radius_end: "${64 * radius}",
             expand_time: 0.1, start_min: 0.03, start_max: 0.3, life_min: 0.15, life_max: 0.25, size_min: 3,
             size_max: 7, brightness: 2.0}
  - id: motes
    effect: burst
    at: [120, 112]
    anchor: {px: [0, 0]}
    params: {duration: 0.55, count: "${int(motes)}", spread: 360, speed_min: 80, speed_max: 220, drag: 4,
             life_min: 0.25, life_max: 0.5, style: dot, size: 1.2, brightness: 1.4, twinkle: 0.4,
             fade_in: 0, fade_out: 1.3, extent: 100}
