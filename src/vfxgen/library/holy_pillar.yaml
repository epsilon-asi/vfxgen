vfxgen: 1
name: holy_pillar
description: "Pillar of light slams down from the sky, flares, widens and fades, with dust kicks, rising motes and ground rings."
size: [256, 512]
fps: 20
duration: 1.15
loop: false
anchors: {ground: [128, 440]}
vars:
  colors: {default: holy, doc: main colour ramp}
  intensity: {default: 1.0, min: 0, max: 4, doc: overall brightness (exposure)}
  width: {default: 1.0, min: 0.1, max: 3, doc: final pillar width multiplier}
  beam: {default: 1.0, min: 0, max: 4, doc: brightness of the pillar itself}
  impact: {default: 1.0, min: 0, max: 4, doc: strength of the ground impact flare and streak}
  ground_ring: {default: true, doc: draw the expanding shock ring and glowing ground rings}
  motes: {default: 46, min: 0, max: 400, doc: number of glittering motes rising in the light}
  dust: {default: 26, min: 0, max: 400, doc: number of dust sparks kicked out along the ground}
  hold: {default: 0.45, min: 0.05, max: 0.9, doc: fraction of the animation at full strength before fading}
  glow: {default: 1.0, min: 0, max: 3, doc: bloom strength}
channels:
  light: {kind: light, palette: "${colors}", exposure: "${intensity}",
          bloom: [[1.5, "${0.5 * glow}"], [5, "${0.4 * glow}"], [14, "${0.25 * glow}"]], alpha_gamma: 0.72}
# Everything rides one global envelope (scene time T): full until `hold`, then eases to 0 at the end.
# The head slams down within 0.05 s (legacy: frame 1); impact parts start then.
layers:
  - id: pillar
    effect: light_column
    at: [128, 440]
    anchor: {px: [0, 0]}
    time_mode: once
    opacity: &env "${(1 if T / 1.15 < ${hold} else smoothstep(1, ${hold}, T / 1.15) ** 1.3)}"
    params: {period: 1.9167, style: pillar, width: "${3 + 26 * width}", width_start: 3, grow_time: 0.46,
             height: 434, brightness: "${0.6 * beam}", core: "${1.8 * beam}", core_halo: "${0.18 * beam}",
             top_fade: 110, fade_power: 1, ground_squash: 0, slam_time: 0.05, head_start: 0.55, rise: -2,
             streak_x: 8, streak_y: 70, pulse: 0, flash: 0.6, flash_time: 0.11}
  - id: flare
    effect: flash
    at: [128, 440]
    start: 0.05
    opacity: *env
    params: {duration: 1.1, radius: 10, grow: 0, brightness: "${2.03 * impact}", decay: 0.11,
             afterglow_radius: 22, afterglow_brightness: "${0.51 * impact}", afterglow_decay: 0.11}
  - id: flare_hold
    effect: glow
    at: [128, 440]
    start: 0.05
    opacity: *env
    params: {period: 1.1, radius: 10, brightness: "${0.8 * impact}", halo_radius: 22, halo_brightness: "${0.2 * impact}"}
  - id: streak
    effect: anamorphic_streak
    at: [128, 440]
    start: 0.05
    opacity: *env
    params: {duration: 1.1, length: 104, width: 2.2, thin: 0.4, brightness: "${1.2 * impact}", flash: 1.27,
             decay: 0.11, sustain: 0.5}
  - id: ground_glow
    effect: ring
    enabled: "${ground_ring}"
    at: [128, 440]
    anchor: {px: [0, 0]}
    start: 0.05
    opacity: *env
    scale: "${3 + 26 * ${width} * (1 - (1 - min((t + 0.05) / 0.46, 1)) ** 3)}"
    params: {period: 1.1, radius: 1.1, width: 0.77, brightness: 0.5, squash: 0.28}
  - id: shock
    effect: shockwave
    enabled: "${ground_ring}"
    at: [128, 440]
    start: 0.05
    params: {duration: 0.72, radius_start: 12, radius_end: 104, expand_time: 0.18, width_start: 1.2,
             width_end: 3.7, brightness: 1.6, fade_time: 0.34, squash: 0.26}
  - id: ground_ring
    effect: shockwave
    enabled: "${ground_ring}"
    at: [128, 440]
    start: 0.05
    opacity: *env
    params: {duration: 1.1, radius_start: 12.5, radius_end: "${min((3 + 26 * width) * 1.5 + 8, 100)}",
             expand_time: 0.12, width_start: 1.6, width_end: 1.6, brightness: 0.9, fade_time: 1000, squash: 0.26}
  - id: dust
    effect: burst
    at: [128, 440]
    anchor: {px: [0, 0]}
    start: 0.05
    scale: [1, 0.26]
    opacity: *env
    params: {duration: 1.1, count: "${dust}", speed_min: 200, speed_max: 475, drag: 5, gravity: -170,
             life_min: 0.7, life_max: 0.7, style: dot, size: 1.3, brightness: 1.3, brightness_var: 0.33,
             fade_in: 0, fade_out: 1, extent: 130}
  - id: motes
    effect: burst
    at: [128, 290]
    anchor: {px: [0, 0]}
    opacity: *env
    params: {duration: 1.15, count: "${motes}", shape: box, radius: 30, radius_y: 150, angle: -90, spread: 30,
             speed_min: 17, speed_max: 61, stagger: 0.4, life_min: 2, life_max: 2, style: dot, size: 1.35,
             brightness: 1.2, brightness_var: 0.33, fade_in: 0.046, fade_out: 0, extent: 220}
