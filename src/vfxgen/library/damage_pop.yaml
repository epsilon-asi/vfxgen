vfxgen: 1
name: damage_pop
description: "Floating damage number: pops in with a punch, drifts up and fades. `crit` makes it bigger, red-orange, shaky, with a \"!\" and a hit star behind it."
size: [192, 128]
fps: 30
duration: 0.9
loop: false
blend: alpha
pivot: {px: [96, 96]}
vars:
  colors: {default: text_white, doc: fill colours of normal hits (dark -> light)}
  crit_palette: {default: text_crit, doc: fill colours of critical hits (dark -> light)}
  glow_palette: {default: impact, doc: crit glow / star colour ramp}
  outline_palette: {default: "#1a0c08", doc: outline / shadow colour}
  text: {default: "128", doc: "the number (digits, A-Z, + - ! % x)"}
  crit: {default: false, doc: "critical hit: bigger, crit colours, \"!\" appended, shake and star"}
  text_size: {default: 1.0, min: 0.4, max: 2.0, doc: text size multiplier}
  drift: {default: 1.0, min: 0, max: 2, doc: how far the number floats up (multiplier)}
  punch: {default: 1.0, min: 0, max: 2.5, doc: pop-in punch multiplier}
channels:
  glow: {kind: light, palette: "${glow_palette}", bloom: [[2, 0.4], [6, 0.35]], alpha_gamma: 0.85}
  text: {kind: solid, palette: "${crit_palette if crit else colors}"}
events:
  - {name: show, t: 0.0, data: {}}
layers:
  - id: star
    effect: star_burst
    enabled: "${crit}"
    at: [96, 86]
    anchor: {px: [0, 0]}
    channels: {light: glow}
    params: {duration: 0.3, points: 8, radius: "${40 * text_size}", spikiness: 1.1, brightness: 0.9}
  - id: number
    effect: text
    at: [96, 86]
    offset: {keys: [[0, [0, 0]], [0.9, [0, "${-44 * drift}"], out]]}
    channels: {solid: text, light: glow}
    feel:
      punch: [{at: 0.0, duration: 0.35, amount: "${(0.55 if crit else 0.3) * punch}"}]
      shake: [{at: 0.0, duration: "${0.25 if crit else 0.01}", amplitude: "${2.5 if crit else 0}", frequency: 30}]
    params: {duration: 0.9, text: "${text + '!' if crit else text}", size: "${(30 if crit else 22) * text_size}",
             weight: 0.24, outline: 0.11, outline_palette: "${outline_palette}", shadow: 0.09,
             glow: "${0.35 if crit else 0}", glow_radius: 0.3, stagger: 0.015, pop: 0.1, overshoot: 0.35,
             fade: 0.3, fade_scale: 0.85, tilt: "${6 if crit else 0}"}
