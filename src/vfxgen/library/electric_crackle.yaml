vfxgen: 1
name: electric_crackle
description: Small erratic electric arcs jumping around a flickering central spark.
size: [256, 256]
fps: 16
duration: 1.5
loop: true
vars:
  colors: {default: electric, doc: main colour ramp}
  intensity: {default: 1.0, min: 0, max: 4, doc: overall brightness (exposure)}
  arcs: {default: 40, min: 0, max: 400, doc: number of arc events across the loop (density)}
  reach: {default: 1.0, min: 0.2, max: 1.25, doc: arc length / radius multiplier}
  roughness: {default: 0.22, min: 0, max: 1, doc: jaggedness of the arcs}
  hop_chance: {default: 0.4, min: 0, max: 1, doc: fraction of arcs that hop around the core instead of shooting out}
  branch_chance: {default: 0.7, min: 0, max: 1, doc: chance an arc grows a small fork}
  micro_arcs: {default: 3, min: 0, max: 30, doc: tiny arcs hugging the core every tick}
  width: {default: 1.0, min: 0.2, max: 4, doc: stroke width multiplier}
  core: {default: 1.0, min: 0, max: 4, doc: brightness of the central spark}
  flicker: {default: 1.0, min: 0, max: 2, doc: core flicker amount}
  glow: {default: 1.0, min: 0, max: 3, doc: bloom strength}
  tick_rate: {default: 16, min: 2, max: 60, doc: arc re-jag / scheduling steps per second}
channels:
  light: {kind: light, palette: "${colors}", exposure: "${intensity}",
          bloom: [[1.2, "${0.6 * glow}"], [4, "${0.7 * glow}"], [12, "${0.6 * glow}"]], alpha_gamma: 0.85}
layers:
  - id: core
    effect: glow
    at: [128, 128]
    params: {period: 1.5, radius: 4, brightness: "${2.2 * core * (1 + 0.25 * min(flicker, 2))}", halo_radius: 14,
             halo_brightness: "${0.4 * core * (1 + 0.25 * min(flicker, 2))}",
             flicker: "${min(0.5 * flicker / (1 + 0.25 * flicker), 1)}", flicker_rate: "${tick_rate}"}
  - id: arcs
    effect: arc_field
    at: [128, 128]
    params: {period: 1.5, tick_rate: "${tick_rate}", arcs: "${arcs}", reach: "${reach}", roughness: "${roughness}",
             hop_chance: "${hop_chance}", branch_chance: "${branch_chance}", micro_arcs: "${micro_arcs}",
             width: "${width}"}
