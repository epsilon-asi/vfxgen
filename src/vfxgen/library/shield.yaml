vfxgen: 1
name: shield
description: "Protective bubble: fresnel rim, hexagon grid on the sphere, shimmer wave sweeping across."
size: [320, 320]
fps: 16
duration: 2.0
loop: true
vars:
  colors: {default: frost, doc: main colour ramp}
  intensity: {default: 1.0, min: 0, max: 4, doc: overall brightness (exposure)}
  radius: {default: 1.0, min: 0.2, max: 1.08, doc: "bubble size multiplier (<= 1.08)"}
  hex_density: {default: 7.0, min: 1, max: 30, doc: hexagon cells across the sphere (higher = smaller cells)}
  grid_brightness: {default: 1.0, min: 0, max: 5, doc: resting brightness of the hex grid lines}
  wave: {default: 1.0, min: 0, max: 4, doc: strength of the shimmer wave}
  waves: {default: 1, min: 0, max: 6, doc: "whole number of shimmer sweeps per loop (0 = none)"}
  twinkle: {default: 0.3, min: 0, max: 1, doc: fraction of cells that randomly glint}
  rim: {default: 1.0, min: 0, max: 4, doc: brightness of the fresnel rim}
  fill: {default: 1.0, min: 0, max: 6, doc: brightness of the faint interior tint}
  highlight: {default: true, doc: small specular highlight top-left}
  glow: {default: 1.0, min: 0, max: 3, doc: bloom strength}
channels:
  light: {kind: light, palette: "${colors}", exposure: "${intensity}",
          bloom: [[1.2, "${0.45 * glow}"], [4, "${0.4 * glow}"], [12, "${0.35 * glow}"]], alpha_gamma: 0.9}
layers:
  - id: bubble
    effect: sphere_shell
    at: [160, 160]
    params: {period: 2.0, radius: "${128 * radius}", hex_density: "${hex_density}",
             grid_brightness: "${grid_brightness}", wave: "${wave}", waves: "${waves}", twinkle: "${twinkle}",
             rim: "${rim}", fill: "${fill}", highlight: "${highlight}"}
