vfxgen: 1
name: freeze_status
description: "Frozen / rooted status overlay (loop, no sprite): a crust of ice spikes around the feet, shards hovering around the body, cold mist rolling along the ground and frost sparkles. Pivot at the character's feet (sized for a ~128 px tall character)."
size: [192, 208]
fps: 16
duration: 2.0
loop: true
blend: alpha
pivot: {px: [96, 180]}
anchors: {feet: [96, 180]}
vars:
  colors: {default: frost, doc: "sparkle / glint colour ramp"}
  ice_palette: {default: ice, doc: ice colours (shadow -> lit)}
  mist_palette: {default: steam, doc: mist colours (shadow -> lit)}
  body_height: {default: 1.0, min: 0.5, max: 1.2, doc: character height multiplier (128 px = 1)}
  crust: {default: 16, min: 0, max: 60, doc: number of ice spikes around the feet}
  crust_size: {default: 1.0, min: 0.3, max: 1.6, doc: ice spike size multiplier}
  floating: {default: 6, min: 0, max: 30, doc: shards hovering around the body}
  mist: {default: 1.0, min: 0, max: 3, doc: ground mist density (0 = off)}
  sparkles: {default: 16, min: 0, max: 100, doc: number of frost sparkles}
channels:
  mist: {kind: smoke, palette: "${mist_palette}", density: 0.8, shadow: 0.2, size_ref: 208}
  solid: {kind: solid}
  light: {kind: light, palette: "${colors}", bloom: [[1.5, 0.45], [5, 0.35], [12, 0.2]], exposure: 1.0, alpha_gamma: 0.85}
layers:
  - id: mist
    effect: smoke_puffs
    at: [96, 176]
    anchor: {px: [0, 0]}
    channels: {smoke: mist}
    enabled: "${mist > 0}"
    params: {mode: roll, period: 2.0, count: 14, laps: 1, rise: 6, spread: 38, spread_start: 16, squash: 0.3,
             radius_start: 8, radius_end: 18, density: "${0.1 * mist}", billow: 0.7, wisp_start: 0.15, wispiness: 0.4,
             fade_in: 0.3, fade_out: 0.45, grain: 3}
  - id: ice
    effect: ice_crystals
    at: [96, 180]
    anchor: {px: [0, 0]}
    params: {period: 2.0, count: "${int(crust)}", radius_x: 32, radius_y: 9, size_min: "${9 * crust_size}",
             size_max: "${26 * crust_size}", lean: 32, float_count: "${int(floating)}", float_height: "${110 * body_height}",
             twinkle: 1.0, ice_palette: "${ice_palette}"}
  - id: sparkles
    effect: particles
    at: [96, "${180 - 60 * body_height}"]
    anchor: {px: [0, 0]}
    params: {period: 2.0, count: "${int(sparkles)}", shape: box, radius: 36, radius_y: "${62 * body_height}",
             angle: 90, spread: 30, speed_min: 3, speed_max: 10, laps_min: 1, laps_max: 2, style: glint, size: 1.0,
             brightness: 1.8, twinkle: 0.6, fade_in: 0.35, fade_out: 1.0, halo: 0.1, extent: 100}
