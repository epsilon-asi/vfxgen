vfxgen: 1
name: beam
description: "Horizontal energy laser: blinding core, turbulent scrolling sheath, emitter flare, impact splash and sparks."
size: [512, 192]
fps: 20
duration: 1.2
loop: true
vars:
  colors: {default: electric, doc: main colour ramp}
  intensity: {default: 1.0, min: 0, max: 4, doc: overall brightness (exposure)}
  core_width: {default: 1.0, min: 0.2, max: 4, doc: width of the blinding core}
  sheath_width: {default: 1.0, min: 0.2, max: 2.5, doc: width of the turbulent outer sheath}
  turbulence: {default: 1.0, min: 0, max: 4, doc: brightness of the sheath plasma}
  filaments: {default: true, doc: draw the bright twisting filaments in the sheath}
  scroll_speed: {default: 1, min: -4, max: 4, doc: whole-number flow speed along the beam (noise periods per loop)}
  surge: {default: 0.22, min: 0, max: 1, doc: amplitude of energy pulses racing along the core}
  flicker: {default: 1.0, min: 0, max: 4, doc: brightness flicker amount}
  emitter: {default: true, doc: draw the emitter flare (left)}
  impact: {default: true, doc: "draw the impact splash, shock rings and sparks (right)"}
  sparks: {default: 40, min: 0, max: 400, doc: number of impact sparks}
  spark_spread: {default: 1.3, min: 0, max: 3.1, doc: spray half-angle of the sparks (radians)}
  glow: {default: 1.0, min: 0, max: 3, doc: bloom strength}
channels:
  light: {kind: light, palette: "${colors}", exposure: "${intensity}",
          bloom: [[1.5, "${0.5 * glow}"], [5, "${0.4 * glow}"], [15, "${0.35 * glow}"]], alpha_gamma: 0.85}
layers:
  - id: beam
    effect: beam_line
    at: [46, 96]
    anchor: emitter
    params: {period: 1.2, length: 412, core_width: "${core_width}", sheath_width: "${sheath_width}",
             turbulence: "${turbulence}", filaments: "${filaments}", scroll_speed: "${scroll_speed}",
             surge: "${surge}", flicker: "${flicker}"}
  - id: emitter
    effect: spike_flare
    enabled: "${emitter}"
    attach: {layer: beam, anchor: emitter}
    anchor: {px: [0, 0]}
    params: {period: 1.2}
  - id: splash
    effect: splash_fan
    enabled: "${impact}"
    attach: {layer: beam, anchor: impact}
    anchor: {px: [0, 0]}
    params: {period: 1.2, flicker: "${flicker}"}
  - id: sparks
    effect: particles
    enabled: "${impact}"
    attach: {layer: beam, anchor: impact}
    anchor: {px: [0, 0]}
    params: {period: 1.2, count: "${sparks}", angle: 180, spread: "${min(spark_spread * 2 * 57.2958, 360)}",
             speed_min: 160, speed_max: 400, drag: 4.5, gravity: 90, laps_min: 1, laps_max: 3,
             style: streak, size: 0.7, brightness: 2.6, brightness_var: 0.33, tail: 0.07,
             fade_in: 0.04, fade_out: 1.2, extent: 92}
