vfxgen: 1
name: lightning_orb_travel
description: "Lightning orb in flight (seamless loop): a flickering ball of plasma inside wobbling shells, crackling with small arcs and dragging a jagged lightning tail and a faint glow streak. Faces +x; pivot on the head - rotate to aim."
size: [256, 128]
fps: 24
duration: 1.0
loop: true
blend: additive
pivot: {px: [196, 64]}
anchors: {head: [196, 64]}
track: [{name: head, layer: core, anchor: head}]
vars:
  colors: {default: electric, doc: main colour ramp (shared by the lightning_orb family)}
  head_size: {default: 1.0, min: 0.5, max: 1.5, doc: orb size multiplier (match launch and impact)}
  trail_length: {default: 1.0, min: 0.3, max: 1.3, doc: tail length multiplier}
  crackle: {default: 1.0, min: 0, max: 3, doc: "brightness of the small arcs around the orb (0 = off)"}
  tick_rate: {default: 16, min: 4, max: 30, doc: re-jag / flicker changes per second}
  intensity: {default: 1.0, min: 0, max: 3, doc: brightness multiplier}
channels:
  light: {kind: light, palette: "${colors}", bloom: [[2, 0.6], [7, 0.6], [22, 0.45]],
          exposure: "${intensity}", alpha_gamma: 0.85}
layers:
  - id: streak
    effect: ribbon
    at: [196, 64]
    anchor: {px: [0, 0]}
    params: {period: 1.0, mode: path, path: line, head: fixed, x0: "${-120 * trail_length}", y0: 0, x1: -4, y1: 0,
             span: 1.0, samples: 32, width_start: "${16 * head_size}", width_end: 2, brightness: 0.35, fade: 1.6,
             head_fade: 0.08, softness: 1.0, core: 0.4, breakup: 0.6, breakup_scale: 4, flow: 4}
  - id: tail
    effect: chain
    at: [196, 64]
    anchor: {px: [0, 0]}
    params: {period: 1.0, style: lightning, ax: -6, ay: 0, bx: "${-110 * trail_length}", by: 0, margin: 26,
             width: 1.1, brightness: 1.0, glow: 0.25, glow_width: 5, roughness: 0.3, tick_rate: "${tick_rate}",
             strands: 2, branches: 2, branch_length: 0.25, flicker: 0.5, flare: 0}
  - id: shells
    effect: wobble_shells
    at: [196, 64]
    scale: "${0.26 * head_size}"
    params: {period: 1.0, shells: 2, radius: 52, wobble: 1.4, width: 3.5, brightness: 0.8, pulse: 0.1, spin: 2}
  - id: core
    effect: projectile_core
    at: [196, 64]
    anchor: head
    params: {period: 1.0, style: orb, radius: "${10 * head_size}", stretch: 1.2, brightness: 0.9, core: 1.8,
             rim: 0.9, turbulence: 1.0, halo: 0.35, halo_radius: 2.2, spin: 4, pulse: 0.08, pulse_cycles: 8,
             flicker: 0.3, flicker_rate: "${tick_rate}"}
  - id: crackle
    effect: arc_field
    enabled: "${crackle > 0}"
    at: [196, 64]
    scale: "${0.36 * head_size}"
    params: {period: 1.0, tick_rate: "${tick_rate}", arcs: 18, reach: 0.9, hop_chance: 0.5, micro_arcs: 2,
             width: 1.6, brightness: "${crackle}"}
