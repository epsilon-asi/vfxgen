vfxgen: 1
name: sword_trail
description: "Sword swing trail: the blade tip sweeps an arc and drags a crescent of light behind it - a soft body ribbon under a hot cutting-edge ribbon - that tapers, tears and fades as the swing slows."
size: [256, 256]
fps: 24
duration: "${duration + 0.2 * trail_length}"
loop: false
blend: additive
pivot: center
events:
  - {name: hit, t: "${0.5 * duration}", data: {note: blade passes the middle of the arc}}
vars:
  colors: {default: steel, doc: "main colour ramp (trail, edge, tip)"}
  duration: {default: 0.3, min: 0.12, max: 1.5, doc: seconds the swing takes}
  radius: {default: 1.0, min: 0.4, max: 1.1, doc: swing radius multiplier}
  trail_length: {default: 1.0, min: 0.2, max: 2, doc: "how much of the swing the trail covers (time window multiplier)"}
  trail_width: {default: 1.0, min: 0.2, max: 2, doc: trail width multiplier}
  body: {default: 0.6, min: 0, max: 2, doc: "brightness of the soft crescent body (0 = edge only)"}
  edge: {default: 1.0, min: 0, max: 3, doc: brightness of the hot cutting edge}
  breakup: {default: 0.45, min: 0, max: 1, doc: noise streaks tearing the trail}
  glow: {default: 1.0, min: 0, max: 4, doc: light exposure}
channels:
  light: {kind: light, palette: "${colors}", bloom: [[1.2, 0.5], [4, 0.45], [12, 0.3]],
          exposure: "${1.2 * glow}", alpha_gamma: 0.9}
defs:
  swing: &swing {duration: "${duration}", ease: out}
layers:
  - id: tip
    effect: glow
    length: "${duration}"
    fade: {out: "${0.3 * duration}"}
    move:
      <<: *swing
      path: {arc: {center: [128, 150], radius: ["${100 * radius}", "${62 * radius}"], from: 192, to: 350}}
    params: {period: 1.0, radius: 2.2, brightness: "${1.6 * edge}", halo_radius: 7, halo_brightness: 0.4}
  - id: inner
    effect: glow
    opacity: 0
    length: "${duration}"
    move:
      <<: *swing
      path: {arc: {center: [128, 150], radius: ["${86 * radius}", "${50 * radius}"], from: 192, to: 350}}
    params: {period: 1.0, radius: 1}
  - id: body
    effect: ribbon
    at: [128, 128]
    anchor: {px: [0, 0]}
    follow: {layer: inner}
    params:
      period: 1.0
      mode: follow
      length_time: "${0.17 * trail_length}"
      samples: 24
      smooth: 4
      min_speed: 120
      reach: 126
      width_start: "${36 * trail_width * radius}"
      width_end: 3
      taper: 1.4
      brightness: "${0.8 * body}"
      fade: 1.1
      head_fade: 0.08
      softness: 1.0
      core: 0
      breakup: "${breakup}"
      breakup_scale: 6
      flow: 0
  - id: edge
    effect: ribbon
    at: [128, 128]
    anchor: {px: [0, 0]}
    follow: {layer: tip}
    params:
      period: 1.0
      mode: follow
      length_time: "${0.17 * trail_length}"
      samples: 24
      smooth: 4
      min_speed: 120
      reach: 126
      width_start: "${7 * trail_width}"
      width_end: 0.6
      taper: 0.9
      brightness: "${1.5 * edge}"
      fade: 1.4
      head_fade: 0.02
      softness: 0.45
      core: 1.3
      core_width: 0.25
      breakup: "${0.6 * breakup}"
      breakup_scale: 9
      flow: 0
