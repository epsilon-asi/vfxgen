vfxgen: 1
name: sleep_zs
description: "Sleeping status (loop, no sprite): Z letters float up and to the side from the head, growing, wobbling and fading. Pivot at the head (where the Zs appear)."
size: [128, 128]
fps: 16
duration: 3.0
loop: true
blend: alpha
pivot: {px: [40, 108]}
anchors: {head: [40, 108]}
vars:
  colors: {default: "#9fd0ff", doc: "glow colour ramp"}
  z_color: {default: "#e4f2ff", doc: colour of the Z letters}
  count: {default: 3, min: 1, max: 8, doc: Zs per loop}
  rise: {default: 70, min: 20, max: 90, doc: how high the Zs float (px)}
  drift: {default: 40, min: -40, max: 60, doc: sideways drift (px; + = right)}
  size: {default: 1.0, min: 0.4, max: 1.4, doc: Z size multiplier}
  glow: {default: 0.5, min: 0, max: 2, doc: glow brightness}
channels:
  solid: {kind: solid}
  light: {kind: light, palette: "${colors}", bloom: [[2, 0.4], [6, 0.25]], exposure: 1.0, alpha_gamma: 0.85}
layers:
  - id: zs
    effect: glyph
    at: [40, 108]
    anchor: {px: [0, 0]}
    params: {period: 3.0, symbol: z, count: "${int(count)}", laps: 1, phases: even, spread_x: 2, spread_y: 2,
             rise: "${rise}", accel: 0.9, drift: "${drift}", drift_var: 0.15, sway: 4, sway_cycles: 1,
             size_start: "${7 * size}", size_end: "${18 * size}", size_var: 0.1, tilt: -12, wobble: 12,
             fade_in: 0.18, fade_out: 0.35, outline: 1.3, glow: "${glow}", glyph_palette: "${z_color}"}
